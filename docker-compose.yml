services:
  db:
    image: mysql:8.0
    container_name: carwash_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: carwash_app
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - carwash_net

  api:
    build: .
    container_name: carwash_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.test
    volumes:
      - .:/app
    networks:
      - carwash_net

  frontend:
    build: ./frontend
    container_name: carwash_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - carwash_net

  test:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.test
    volumes:
      - .:/app
    command: pytest -v
    networks:
      - carwash_net

volumes:
  mysql_data:

networks:
  carwash_net:
    driver: bridge